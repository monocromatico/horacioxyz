name: Deploy to Hetzner

on:
  push:
    tags:
      - '*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generar deploy.json
        run: |
          printf '{"tag": "%s", "deployed_at": "%s"}\n' \
            "${{ github.ref_name }}" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > web/deploy.json
          cat web/deploy.json

      - name: Deploy via rsync
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          # Sin ruta remota: la llave está restringida vía rrsync a
          # /opt/stacks/horacio.xyz/web/ en el server (ver authorized_keys).
          # Pasar la ruta absoluta aquí hace que rrsync la concatene con la
          # suya y duplique el path (mkdir .../web/opt/stacks/.../web falla).
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            web/ "horacio@${DEPLOY_HOST}:"
        env:
          DEPLOY_KEY: ${{ secrets.HETZNER_DEPLOY_KEY }}
          DEPLOY_HOST: 188.245.164.202
